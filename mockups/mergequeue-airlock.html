<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge Queue Airlock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root {
  --bg: #0b0d10; --ink: #d9dee6; --muted: #8a93a1; --line: #2e3540; --panel: #15191f;
  --cryo: #9fd8f0; --awake: #45e6a0; --alien: #ff3b5c; --amber: #ffb547; --int: #b39ae0;
  --head: "Chakra Petch", "Eurostile", "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: #05070a; color: var(--ink); font-family: var(--sans); }
main { max-width: 1280px; margin: 0 auto; padding-block: 32px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1.page { font: 700 32px var(--head); margin: 0 0 6px; }
p.lead { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
.ctl { display: flex; gap: 8px; align-items: center; margin: 10px 0 24px; font: 600 14px var(--mono); color: var(--muted); }
.ctl button { font: 600 14px var(--mono); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; border: 1px solid #222; }
.slide { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden;
  background: radial-gradient(1100px 700px at 80% -20%, #1b2027 0%, transparent 60%), radial-gradient(900px 600px at -10% 120%, #171a1f 0%, transparent 55%), var(--bg); }
.slide > svg { position: absolute; inset: 0; }
header.h { position: absolute; left: 72px; top: 64px; z-index: 2; }
.kicker { font: 600 18px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--int); }
header.h h3 { margin: 6px 0 0; font: 700 54px/1.05 var(--head); text-transform: uppercase; color: #fff; }

.tunnel { fill: rgba(111, 182, 232, .04); stroke: var(--line); stroke-width: 3; }
.lamp { stroke: #cfefff; stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 8px #9fd8f0); opacity: .8; }
.floor { stroke: #3a4350; stroke-width: 3; stroke-dasharray: 18 12; }
.lock { fill: rgba(179, 154, 224, .05); stroke: var(--int); stroke-width: 4; transition: stroke .4s, fill .4s; }
.lock.busy { fill: rgba(255, 181, 71, .06); stroke: var(--amber); }
.lock.done { fill: rgba(69, 230, 160, .07); stroke: var(--awake); }
.locktag { font: 700 20px var(--mono); fill: var(--int); letter-spacing: .14em; text-transform: uppercase; }
.door { fill: #2a313a; stroke: var(--int); stroke-width: 2; transition: transform .6s ease-in-out, opacity .6s; }
.door.open { transform: translateY(-120px); opacity: 0; }
.hazard { fill: url(#hz); }

.sh { transition: transform var(--t, 1.2s) ease-in-out, opacity .5s; }
.sh .tr { fill: #1c2228; stroke: #0c0f12; stroke-width: 2; }
.sh .bd { fill: #46525e; stroke: #222a32; stroke-width: 2; transition: stroke .4s; }
.sh .wn { fill: #ffcf7a; opacity: .55; }
.sh .st { fill: #d9822b; }
.sh .lp { fill: var(--amber); filter: drop-shadow(0 0 6px var(--amber)); }
.sh.in .bd { stroke: var(--amber); stroke-width: 3; }
.sh.ok .bd { stroke: var(--awake); stroke-width: 3; }
.sh text { font: 600 15px var(--mono); fill: var(--ink); }
.sh.in text { fill: var(--amber); } .sh.ok text { fill: var(--awake); }

.scan { fill: url(#scanG); opacity: 0; }
.scan.on { opacity: 1; animation: scan 1.1s ease-in-out infinite alternate; }
@keyframes scan { from { transform: translateX(0); } to { transform: translateX(330px); } }

.status { font: 700 34px var(--head); fill: var(--amber); text-transform: uppercase; letter-spacing: .04em; }
.status.ok { fill: var(--awake); }
.step circle { fill: #1a1f26; stroke: var(--muted); stroke-width: 3; transition: fill .3s, stroke .3s; }
.step text { font: 500 24px var(--mono); fill: var(--muted); transition: fill .3s; }
.step .spin { fill: none; stroke: var(--amber); stroke-width: 4; stroke-dasharray: 20 40; opacity: 0; transform-box: fill-box; transform-origin: center; }
.step.now .spin { opacity: 1; animation: spin .8s linear infinite; }
.step.now text { fill: var(--amber); }
.step.done circle { fill: var(--awake); stroke: var(--awake); filter: drop-shadow(0 0 6px var(--awake)); }
.step.done text { fill: var(--ink); }
@keyframes spin { to { transform: rotate(360deg); } }

.rail { stroke: var(--awake); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--awake)); }
.railtag { font: 700 20px var(--mono); fill: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.commit { transition: transform .6s ease-in-out, opacity .6s; }
.commit circle { fill: #1a1f26; stroke: var(--awake); stroke-width: 4; }
.commit text { font: 500 20px var(--mono); fill: var(--ink); }
.commit.new circle { fill: var(--awake); filter: drop-shadow(0 0 10px var(--awake)); }
.commit.new text { fill: var(--awake); }
</style>
</head>
<body>
<main>
<h1 class="page">Merge queue · zoom on the airlock</h1>
<p class="lead">Follows “Ten agents, one main”. Runs on a timer, no clicks: the front shuttle drives in, the airlock rebases, builds, tests and merges, the shuttle drives out onto main, and the queue moves up one.</p>
<div class="wrap"><div class="slide" id="s"></div></div>
<div class="ctl"><button data-act="pause">pause</button><button data-act="restart">restart</button><button data-act="fast">speed ×1</button></div>
</main>
<script>
const NAMES = ['auth', 'pdf-export', 'user-prefs', 'search', 'dark-mode', 'fix-i18n', 'checkout', 'discount', 'wishlist', 'tax'];
const STEPS = [['rebase onto main', 'Rebasing'], ['build', 'Building'], ['test', 'Testing'], ['merge --ff-only', 'Merging']];
const LOCK = { x: 600, y: 300, w: 440, h: 260 };
const PARK = { x: 750, y: 430 };
const slot = i => ({ x: 400 - i * 175, y: 430 });
const shuttle = n => `<g class="sh"><g transform="scale(1.3)">
  <rect class="tr" x="0" y="50" width="104" height="18" rx="9"/><path class="bd" d="M6 52 L12 16 L70 6 L98 22 L106 52 Z"/>
  <path class="wn" d="M74 13 L94 24 L91 32 L72 28 Z"/><rect class="st" x="10" y="38" width="92" height="6"/><circle class="lp" cx="103" cy="46" r="4"/></g>
  <text x="69" y="-12" text-anchor="middle">${n}</text></g>`;

const el = document.getElementById('s');
el.innerHTML = `<header class="h"><div class="kicker">Deck 2 · Integration · Merge queue</div><h3>Through the airlock</h3></header>
<svg viewBox="0 0 1600 900">
  <defs>
    <pattern id="hz" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ffb547"/><rect x="10" width="10" height="20" fill="#1a1f26"/></pattern>
    <linearGradient id="scanG" x1="0" x2="1"><stop offset="0" stop-color="#ffb547" stop-opacity="0"/><stop offset=".5" stop-color="#ffb547" stop-opacity=".35"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></linearGradient>
    <clipPath id="lockClip"><rect x="${LOCK.x}" y="${LOCK.y}" width="${LOCK.w}" height="${LOCK.h}" rx="16"/></clipPath>
  </defs>
  <path class="tunnel" d="M-10 560 V360 Q-10 300 60 300 H${LOCK.x - 10} V560 Z"/>
  ${[60, 200, 340, 480].map(x => `<line class="lamp" x1="${x}" y1="312" x2="${x + 70}" y2="312"/>`).join('')}
  <line class="floor" x1="0" y1="535" x2="1290" y2="535"/>
  <rect class="lock" id="lock" x="${LOCK.x}" y="${LOCK.y}" width="${LOCK.w}" height="${LOCK.h}" rx="16"/>
  <g clip-path="url(#lockClip)"><rect class="scan" id="scan" x="${LOCK.x}" y="${LOCK.y}" width="110" height="${LOCK.h}"/></g>
  <text class="locktag" x="${LOCK.x + LOCK.w / 2}" y="${LOCK.y - 18}" text-anchor="middle">the airlock</text>
  <g id="ships"></g>
  <rect class="door" id="dl" x="${LOCK.x - 8}" y="${LOCK.y + 8}" width="16" height="${LOCK.h - 16}"/>
  <rect class="door" id="dr" x="${LOCK.x + LOCK.w - 8}" y="${LOCK.y + 8}" width="16" height="${LOCK.h - 16}"/>
  <rect class="hazard" x="${LOCK.x}" y="${LOCK.y + LOCK.h}" width="${LOCK.w}" height="10"/>
  <text class="status" id="status" x="${LOCK.x + LOCK.w / 2}" y="${LOCK.y + LOCK.h + 70}" text-anchor="middle"></text>
  ${STEPS.map(([t], i) => `<g class="step" id="st${i}"><circle cx="${LOCK.x + 40}" cy="${LOCK.y + LOCK.h + 120 + i * 50}" r="11"/><circle class="spin" cx="${LOCK.x + 40}" cy="${LOCK.y + LOCK.h + 120 + i * 50}" r="17"/><text x="${LOCK.x + 72}" y="${LOCK.y + LOCK.h + 128 + i * 50}">${t}</text></g>`).join('')}
  <line class="rail" x1="1330" y1="820" x2="1330" y2="260"/>
  <text class="railtag" x="1330" y="860" text-anchor="middle">main</text>
  <g id="commits"></g>
</svg>`;

const ships = el.querySelector('#ships'), commits = el.querySelector('#commits');
const lock = el.querySelector('#lock'), scan = el.querySelector('#scan'), status = el.querySelector('#status');
const dl = el.querySelector('#dl'), dr = el.querySelector('#dr');
const put = (g, p, t = 1.2) => { g.style.setProperty('--t', t + 's'); g.style.transform = `translate(${p.x}px, ${p.y}px)`; };

let speed = 1, paused = false, gen = 0;
const sleep = ms => new Promise(r => { const tick = () => { if (paused) return setTimeout(tick, 100); setTimeout(r, ms / speed); }; tick(); });

let queue, mainList;
const drawCommits = () => {
  commits.innerHTML = mainList.slice(0, 8).map((n, i) => `<g class="commit ${i === 0 && n.fresh ? 'new' : ''}" style="transform: translateY(${i * 70}px)"><circle cx="1330" cy="300" r="13"/><text x="1360" y="307">${n.name}</text></g>`).join('');
};
const reset = () => {
  gen++;
  ships.innerHTML = '';
  queue = NAMES.map(n => { ships.insertAdjacentHTML('beforeend', shuttle(n)); return ships.lastElementChild; });
  queue.forEach((g, i) => { g.style.transition = 'none'; put(g, slot(i)); g.getBoundingClientRect(); g.style.transition = ''; });
  mainList = ['chore/lockfile', 'fix/cart', 'feat/auth-v1'].map(name => ({ name }));
  drawCommits();
  STEPS.forEach((_, i) => el.querySelector('#st' + i).setAttribute('class', 'step'));
  status.textContent = ''; status.setAttribute('class', 'status');
  lock.setAttribute('class', 'lock'); dl.classList.add('open'); dr.classList.remove('open');
  run(gen);
};

async function run(g) {
  await sleep(900);
  while (g === gen && queue.length) {
    const s = queue.shift();
    STEPS.forEach((_, i) => el.querySelector('#st' + i).setAttribute('class', 'step'));
    dl.classList.add('open');
    s.classList.add('in');
    put(s, PARK, 1.3);
    queue.forEach((q, i) => put(q, slot(i), 1.3));
    await sleep(1400); if (g !== gen) return;
    dl.classList.remove('open');
    lock.setAttribute('class', 'lock busy');
    scan.classList.add('on');
    await sleep(500); if (g !== gen) return;
    for (let i = 0; i < STEPS.length; i++) {
      el.querySelector('#st' + i).setAttribute('class', 'step now');
      status.textContent = STEPS[i][1] + '…';
      await sleep(i === 3 ? 800 : 1150); if (g !== gen) return;
      el.querySelector('#st' + i).setAttribute('class', 'step done');
    }
    scan.classList.remove('on');
    lock.setAttribute('class', 'lock done');
    status.textContent = '✓ Green'; status.setAttribute('class', 'status ok');
    s.classList.remove('in'); s.classList.add('ok');
    await sleep(500); if (g !== gen) return;
    dr.classList.add('open');
    await sleep(500); if (g !== gen) return;
    put(s, { x: 1180, y: 430 }, 1.1);
    await sleep(900); if (g !== gen) return;
    s.style.opacity = 0;
    dr.classList.remove('open');
    mainList.unshift({ name: s.querySelector('text').textContent, fresh: true });
    drawCommits();
    lock.setAttribute('class', 'lock');
    STEPS.forEach((_, i) => el.querySelector('#st' + i).setAttribute('class', 'step'));
    status.textContent = ''; status.setAttribute('class', 'status');
    await sleep(600); if (g !== gen) return;
    s.remove();
  }
  if (g === gen) { await sleep(1500); if (g === gen) reset(); }
}

const wrap = document.querySelector('.wrap');
const fit = () => { el.style.transform = 'scale(' + (wrap.clientWidth / 1600) + ')'; };
addEventListener('resize', fit); fit();
document.querySelector('.ctl').addEventListener('click', e => {
  const a = e.target.dataset.act; if (!a) return;
  if (a === 'pause') { paused = !paused; e.target.textContent = paused ? 'play' : 'pause'; }
  if (a === 'restart') reset();
  if (a === 'fast') { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; e.target.textContent = 'speed ×' + speed; }
});
reset();
</script>
</body>
</html>
